name: tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Prepare config for tests
        # config.yaml 被 .gitignore 忽略，干净检出里不存在；而测试会构造
        # config.Config()，缺文件即抛 ConfigError，导致 CI 从未通过。
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'chitose-output'
          $recycle = Join-Path $env:RUNNER_TEMP 'chitose-recycle'
          New-Item -ItemType Directory -Force -Path $out, $recycle | Out-Null
          "path:`n  output: '$out'`n  recycle: '$recycle'" | Out-File -Encoding utf8 config.yaml
          Get-Content config.yaml

      - name: Run unit tests
        run: python -W ignore::ResourceWarning -m unittest discover -s tests -q
